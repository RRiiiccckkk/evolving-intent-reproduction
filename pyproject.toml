[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolvingintent"
version = "0.1.0"
description = "EvolvingIntent: benchmarking LLM agents on tracking dynamic, evolving user intent in multi-turn conversations"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["evaluation*", "intent_construction*", "situated_simulation*"]

[tool.setuptools.package-data]
"*" = [
    "*.txt",
    "*.json",
    "*.jsonl",
    "*.sql",
    "*.yaml",
    "*.yml",
    "prompts/*.txt",
    "prompts/**/*.txt",
]
