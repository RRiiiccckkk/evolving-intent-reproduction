name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-reproduction-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile workflow
        run: python -m compileall -q reproduction
      - name: Run unit tests
        run: python -m unittest discover -s reproduction/tests -v
      - name: Run offline dry-run
        run: >-
          python -m reproduction.plan_a dry-run
          --run-id ci-dry-run
          --run-dir "${{ runner.temp }}/plan-a-dry-run"
          --sample-count 20
          --ignore-deadline
